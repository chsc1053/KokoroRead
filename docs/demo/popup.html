<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KokoroRead popup demo</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1914;
        --muted: #5c564c;
        --line: #d9d2c5;
        --paper: #f7f2e8;
        --paper-2: #efe7d8;
        --accent: #b45309;
        --accent-2: #92400e;
        --ok: #1f6b3a;
        --radius: 10px;
        --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        --ui: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #2a2620;
        font-family: var(--ui);
      }
      .chrome {
        width: 360px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0,0,0,0.45);
        border: 1px solid rgba(255,255,255,0.08);
      }
      .app {
        width: 360px;
        min-height: 320px;
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        background:
          radial-gradient(120% 80% at 0% 0%, #fff9ef 0%, transparent 55%),
          linear-gradient(160deg, var(--paper), var(--paper-2));
        color: var(--ink);
        font-size: 13px;
      }
      .header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .brand { display: flex; align-items: center; gap: 8px; }
      .brand-mark { width: 28px; height: 28px; border-radius: 7px; display: block; }
      h1 { margin: 0; font-family: var(--font); font-size: 22px; letter-spacing: -0.02em; font-weight: 700; }
      .badge {
        border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--accent-2);
        background: rgba(255,255,255,0.45);
      }
      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 10px;
        background: rgba(255,255,255,0.35);
      }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
      .field:last-child { margin-bottom: 0; }
      .field > span { font-size: 11px; color: var(--muted); }
      .voice-row { display: flex; align-items: center; gap: 6px; }
      .voice-row select { flex: 1; min-width: 0; }
      select {
        width: 100%; appearance: none; border: 1px solid var(--line); border-radius: 8px;
        padding: 7px 10px; background: #fffdf8; color: var(--ink); font: inherit;
      }
      .sample-btn {
        width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
        background: #fffdf8; color: var(--accent-2); border: 1px solid var(--line); border-radius: 8px;
      }
      .sample-icon { width: 18px; height: 18px; display: block; }
      .backend-indicator { margin-top: 8px; font-size: 11px; color: var(--muted); }
      .backend-indicator strong { color: var(--ink); font-weight: 600; }
      .actions { display: grid; gap: 8px; }
      button.primary {
        border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
        background: linear-gradient(180deg, #d97706, var(--accent));
        color: #f5fffc; border-radius: 8px; padding: 8px 10px; font: inherit; font-weight: 600;
      }
      .footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .linkish { background: transparent; border: none; color: var(--accent-2); padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; font: inherit; }
      .privacy { font-size: 10px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="chrome" id="popup">
      <div class="app">
        <header class="header">
          <div class="brand">
            <img class="brand-mark" src="icon48.png" width="28" height="28" alt="" />
            <h1>KokoroRead</h1>
          </div>
          <span class="badge">ready</span>
        </header>
        <section class="panel">
          <label class="field">
            <span>Engine</span>
            <select>
              <option>System voices (fast)</option>
              <option selected>Kokoro neural (higher quality)</option>
            </select>
          </label>
          <div class="field">
            <span>Voice</span>
            <div class="voice-row">
              <select>
                <option selected>Heart · 🚺❤️ · en-us</option>
                <option>Bella · 🚺🔥 · en-us</option>
                <option>Adam · 🚹 · en-us</option>
              </select>
              <button type="button" class="sample-btn" aria-label="Play sample">
                <svg viewBox="0 0 24 24" class="sample-icon" aria-hidden="true">
                  <path fill="currentColor" d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a3.5 3.5 0 0 0-1.8-3.05v6.1A3.5 3.5 0 0 0 16.5 12zM14.7 4.07v2.06A6.5 6.5 0 0 1 19 12a6.5 6.5 0 0 1-4.3 5.87v2.06A8.5 8.5 0 0 0 21 12a8.5 8.5 0 0 0-6.3-7.93z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="backend-indicator">Active: <strong>WebGPU · fp32</strong></div>
        </section>
        <section class="actions">
          <button type="button" class="primary">Open player</button>
        </section>
        <section class="footer">
          <button type="button" class="linkish">Diagnostics</button>
          <span class="privacy">Local-only · no cloud TTS</span>
        </section>
      </div>
    </div>
  </body>
</html>
